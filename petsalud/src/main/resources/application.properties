spring.application.name=backendpetsalud
spring.datasource.url=jdbc:mysql://localhost:3306/letrasypapeles_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${PETSALUD_DB_USER:root}
spring.datasource.password=${PETSALUD_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

